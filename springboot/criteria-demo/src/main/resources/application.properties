# In-memory H2 (data disappears on restart)
spring.datasource.url=jdbc:h2:mem:demo;DB_CLOSE_DELAY=-1
# Or a local file-based H2 (data kept in ./data/demo.mv.db):
# spring.datasource.url=jdbc:h2:file:./data/demo;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Browse the DB at http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:demo)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
